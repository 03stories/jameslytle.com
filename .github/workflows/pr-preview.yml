name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pages: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Resolve active Pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          pages_path=$(node -e 'process.stdout.write(new URL(process.argv[1]).pathname.replace(/\/?$/, "/"))' "$pages_url")
          pages_base_url=$(node -e 'const url = new URL(process.argv[1]); process.stdout.write((url.host + url.pathname).replace(/\/$/, ""))' "$pages_url")
          printf 'url=%s\n' "$pages_base_url" >> "$GITHUB_OUTPUT"
          printf 'base_path=%spr-preview/pr-%s/\n' "$pages_path" "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: github.event.action != 'closed'
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Ensure dist exists for cleanup runs
        if: github.event.action == 'closed'
        run: mkdir -p dist

      - name: Publish PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          source-dir: dist
          pages-base-url: ${{ steps.pages.outputs.url }}
