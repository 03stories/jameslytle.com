<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Encode the insight, not just the chart</title>
  <desc id="d">A synthetic narrative page. The headline says the strongest result came from guided onboarding, with that phrase emphasized. In the bar chart, the guided onboarding bar at 72 percent is striped, while self-serve at 48 percent and hybrid at 59 percent are plain. Three rules: name the finding, connect the emphasis, make the bar unmistakable.</desc>
  <defs>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fff"/>
      <rect width="4" height="10" fill="#000"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#fff"/>

  <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">A REUSABLE NARRATIVE CONVENTION</text>
  <text x="40" y="64" font-size="12" fill="#000">synthetic example</text>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#000" stroke-width="1"/>

  <!-- card -->
  <rect x="80" y="110" width="520" height="440" rx="24" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="120" y="166" font-size="20" fill="#000">The strongest result came from</text>
  <text x="120" y="204" font-size="32" font-weight="800" fill="#000">guided onboarding</text>
  <text x="120" y="236" font-size="13" fill="#000">Completion rate by experience type</text>

  <line x1="120" y1="490" x2="560" y2="490" stroke="#000" stroke-width="1.5"/>
  <rect x="150" y="380" width="80" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="300" y="325" width="80" height="165" fill="url(#stripe)" stroke="#000" stroke-width="3"/>
  <rect x="450" y="355" width="80" height="135" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <g font-size="14" text-anchor="middle" fill="#000">
    <text x="190" y="370">48%</text>
    <text x="340" y="314" font-size="18" font-weight="800">72%</text>
    <text x="490" y="345">59%</text>
    <text x="190" y="516">Self-serve</text>
    <text x="340" y="516" font-weight="700">Guided</text>
    <text x="490" y="516">Hybrid</text>
  </g>
  <!-- connector from headline to bar -->
  <path d="M250,252 C250,280 340,272 340,294" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- rules -->
  <g fill="#000">
    <text x="680" y="150" font-size="13" font-weight="700" letter-spacing="1.5">ONE CONNECTED EMPHASIS</text>
    <circle cx="694" cy="210" r="14" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="694" y="215" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="724" y="208" font-size="18" font-weight="700">Name the finding</text>
    <text x="724" y="230" font-size="13">A short headline says what matters.</text>
    <circle cx="694" cy="300" r="14" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="694" y="305" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="724" y="298" font-size="18" font-weight="700">Connect the emphasis</text>
    <text x="724" y="320" font-size="13">The headline and the bar share one accent color.</text>
    <circle cx="694" cy="390" r="14" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="694" y="395" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="724" y="388" font-size="18" font-weight="700">Make the bar unmistakable</text>
    <text x="724" y="410" font-size="13">A restrained stripe creates the focal point.</text>
    <line x1="680" y1="460" x2="1120" y2="460" stroke="#000" stroke-width="1"/>
    <text x="680" y="492" font-size="15" font-weight="700">Checked automatically:</text>
    <text x="680" y="514" font-size="13">a bundled script flags striped bars with no matching text reference.</text>
  </g>
</svg>
