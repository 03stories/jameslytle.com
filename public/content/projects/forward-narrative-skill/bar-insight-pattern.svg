<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Reusable insight emphasis pattern</title>
<desc id="desc">Name the finding, connect the headline and referenced bar through a shared emphasis cue, and stripe that bar. Synthetic example: guided onboarding 72%, self-serve 48%, hybrid 59%.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#69716e" stroke-width="1.2"/></marker><pattern id="stripe" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e0e5e2"/><path d="M 0 0 V 7" stroke="#303a35" stroke-width="3"/></pattern></defs>
<rect width="1000" height="690" fill="#fafbf9"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">
<text x="40" y="48" font-size="16" text-anchor="start" fill="#242928">03 / INSIGHT EMPHASIS</text><rect x="40" y="105" width="256" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="168.0" y="140.0" font-size="18" text-anchor="middle" fill="#242928">Name the finding</text><text x="168.0" y="164.0" font-size="13" text-anchor="middle" fill="#616965">concise insight headline</text><rect x="372" y="105" width="256" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="500.0" y="140.0" font-size="18" text-anchor="middle" fill="#242928">Connect the cue</text><text x="500.0" y="164.0" font-size="13" text-anchor="middle" fill="#616965">headline + referenced bar</text><rect x="704" y="105" width="256" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="832.0" y="140.0" font-size="18" text-anchor="middle" fill="#242928">Highlight the bar</text><text x="832.0" y="164.0" font-size="13" text-anchor="middle" fill="#616965">striped treatment</text><path d="M 296 143 H 372" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 628 143 H 704" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="240" width="920" height="370" fill="none" stroke="#c9cecb"/><text x="64" y="274" font-size="13" text-anchor="start" fill="#616965">SYNTHETIC OUTPUT</text><text x="80" y="326" font-size="24" text-anchor="start" fill="#242928">Guided onboarding leads completion</text><text x="80" y="355" font-size="14" text-anchor="start" fill="#616965">Completion rate by experience type</text><path d="M 150 527 H 690" stroke="#b0b8b3"/><rect x="205" y="441" width="90" height="86" fill="#d5dad7"/><text x="250" y="427" font-size="16" text-anchor="middle" fill="#242928">48%</text><text x="250" y="558" font-size="14" text-anchor="middle" fill="#242928">Self-serve</text><rect x="365" y="398" width="90" height="129" fill="url(#stripe)"/><text x="410" y="384" font-size="16" text-anchor="middle" fill="#242928">72%</text><text x="410" y="558" font-size="14" text-anchor="middle" fill="#242928">Guided</text><rect x="525" y="421" width="90" height="106" fill="#d5dad7"/><text x="570" y="407" font-size="16" text-anchor="middle" fill="#242928">59%</text><text x="570" y="558" font-size="14" text-anchor="middle" fill="#242928">Hybrid</text><path d="M 820 181 V 400 H 690 V 462 H 455" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="40" y="653" font-size="14" text-anchor="start" fill="#616965">One shared emphasis cue makes the intended comparison visible.</text>
</g></svg>
