<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Forward narrative workflow before and after the Claude Skill</title>
  <desc id="desc">A multi-day, single-author code deployment workflow changes into rapid team-wide authoring through a Claude Skill and Dispatch MCP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A31"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32D4BE"/>
      <stop offset="1" stop-color="#55A8FF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="28" fill="url(#grid)"/>
  <text x="92" y="100" fill="#F7FAFF" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700">From deployment bottleneck to team capability</text>
  <text x="92" y="148" fill="#AEBBD4" font-family="Inter, Arial, sans-serif" font-size="24">Synthetic workflow diagram • no client or internal system data</text>

  <rect x="76" y="210" width="1448" height="238" rx="28" fill="#FFFFFF" fill-opacity="0.055" stroke="#FF7B72" stroke-opacity="0.42"/>
  <text x="116" y="266" fill="#FF9A92" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">BEFORE · ONE SPECIALIST</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#F7FAFF" text-anchor="middle">
    <g filter="url(#shadow)"><rect x="116" y="302" width="225" height="92" rx="18" fill="#202B45"/><text x="228" y="343">Create locally</text><text x="228" y="371" fill="#AEBBD4" font-size="17">manual JSON</text></g>
    <text x="372" y="360" fill="#FF9A92" font-size="34">→</text>
    <g filter="url(#shadow)"><rect x="405" y="302" width="225" height="92" rx="18" fill="#202B45"/><text x="518" y="343">Open PR</text><text x="518" y="371" fill="#AEBBD4" font-size="17">wait for review</text></g>
    <text x="661" y="360" fill="#FF9A92" font-size="34">→</text>
    <g filter="url(#shadow)"><rect x="694" y="302" width="225" height="92" rx="18" fill="#202B45"/><text x="807" y="343">Merge</text><text x="807" y="371" fill="#AEBBD4" font-size="17">coordinate release</text></g>
    <text x="950" y="360" fill="#FF9A92" font-size="34">→</text>
    <g filter="url(#shadow)"><rect x="983" y="302" width="225" height="92" rx="18" fill="#202B45"/><text x="1096" y="343">Deploy</text><text x="1096" y="371" fill="#AEBBD4" font-size="17">publish build</text></g>
    <text x="1239" y="360" fill="#FF9A92" font-size="34">→</text>
    <g filter="url(#shadow)"><rect x="1272" y="302" width="204" height="92" rx="18" fill="#3A2631" stroke="#FF7B72"/><text x="1374" y="343">Share URL</text><text x="1374" y="371" fill="#FFB6B0" font-size="17">multi-day path</text></g>
  </g>

  <rect x="76" y="486" width="1448" height="326" rx="28" fill="#FFFFFF" fill-opacity="0.07" stroke="#48D8C0" stroke-opacity="0.5"/>
  <text x="116" y="544" fill="#58E4CF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">AFTER · THE WHOLE TEAM</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#F7FAFF" text-anchor="middle">
    <g filter="url(#shadow)"><rect x="116" y="594" width="255" height="112" rx="20" fill="#183440" stroke="#48D8C0" stroke-opacity="0.7"/><text x="244" y="637">Sales context</text><text x="244" y="668" fill="#AEEDE4" font-size="17">audience · goal · story</text></g>
    <text x="407" y="662" fill="#58E4CF" font-size="38">→</text>
    <g filter="url(#shadow)"><rect x="448" y="594" width="278" height="112" rx="20" fill="#183440" stroke="#48D8C0" stroke-opacity="0.7"/><text x="587" y="637">Claude Skill</text><text x="587" y="668" fill="#AEEDE4" font-size="17">create · critique · refine</text></g>
    <text x="762" y="662" fill="#58E4CF" font-size="38">→</text>
    <g filter="url(#shadow)"><rect x="803" y="594" width="278" height="112" rx="20" fill="#183440" stroke="#48D8C0" stroke-opacity="0.7"/><text x="942" y="637">Dispatch MCP</text><text x="942" y="668" fill="#AEEDE4" font-size="17">validate · save · share</text></g>
    <text x="1117" y="662" fill="#58E4CF" font-size="38">→</text>
    <g filter="url(#shadow)"><rect x="1158" y="594" width="318" height="112" rx="20" fill="url(#after)"/><text x="1317" y="637" fill="#07141D" font-weight="800">Custom narrative</text><text x="1317" y="668" fill="#0B2C36" font-size="17">rapid, shareable experience</text></g>
  </g>
  <text x="116" y="764" fill="#AEBBD4" font-family="Inter, Arial, sans-serif" font-size="21">Production became the fastest step. Human attention moved to the relationship and the story.</text>
</svg>
