d</text><path d="M 758 188 H 788" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="788" y="150" width="152" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="864.0" y="185.0" font-size="18" text-anchor="middle" fill="#242928">Share URL</text><text x="864.0" y="209.0" font-size="13" text-anchor="middle" fill="#616965">after deploy</text><rect x="60" y="347" width="192" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="156.0" y="382.0" font-size="18" text-anchor="middle" fill="#242928">Sales context</text><text x="156.0" y="406.0" font-size="13" text-anchor="middle" fill="#616965">audience / goal</text><path d="M 252 385 H 292" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="292" y="347" width="192" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="388.0" y="382.0" font-size="18" text-anchor="middle" fill="#242928">Claude Skill</text><text x="388.0" y="406.0" font-size="13" text-anchor="middle" fill="#616965">create / refine</text><path d="M 484 385 H 524" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="524" y="347" width="192" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="620.0" y="382.0" font-size="18" text-anchor="middle" fill="#242928">Dispatch MCP</text><text x="620.0" y="406.0" font-size="13" text-anchor="middle" fill="#616965">validate / save</text><path d="M 716 385 H 756" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="756" y="347" width="192" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="852.0" y="382.0" font-size="18" text-anchor="middle" fill="#242928">Share narrative</text><text x="852.0" y="406.0" font-size="13" text-anchor="middle" fill="#616965">shareable URL</text><text x="40" y="488" font-size="14" text-anchor="start" fill="#616965">Production gives way to audience, relationship, and story.</text>
