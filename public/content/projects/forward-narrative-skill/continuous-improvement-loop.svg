<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">A skill that improves through observed use</title>
  <desc id="d">A five-step loop: observe real team sessions, preserve specific evidence, synthesize recurring patterns, choose the right system layer (skill guidance, validation, or a better product default), and release a new version with a changelog, then observe again.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff"/>
      <rect width="3" height="8" fill="#000"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="#fff"/>

  <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">THE IMPROVEMENT LOOP</text>
  <text x="40" y="64" font-size="12" fill="#000">specific evidence stays specific · only recurring patterns become system changes</text>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#000" stroke-width="1"/>

  <g stroke="#000" fill="#fff" stroke-width="1.5">
    <rect x="40" y="110" width="196" height="150" rx="8"/>
    <rect x="270" y="110" width="196" height="150" rx="8"/>
    <rect x="500" y="110" width="196" height="150" rx="8"/>
    <rect x="730" y="110" width="200" height="230" rx="8" stroke-width="3"/>
    <rect x="964" y="110" width="196" height="150" rx="8"/>
  </g>
  <g fill="#000">
    <g font-size="13" font-weight="700"><text x="58" y="140">1</text><text x="288" y="140">2</text><text x="518" y="140">3</text><text x="748" y="140">4</text><text x="982" y="140">5</text></g>
    <g font-size="16" font-weight="600">
      <text x="58" y="168">Observe</text><text x="58" y="188">team use</text>
      <text x="288" y="168">Preserve</text><text x="288" y="188">the evidence</text>
      <text x="518" y="168">Synthesize</text><text x="518" y="188">patterns</text>
      <text x="748" y="168">Choose the</text><text x="748" y="188">right layer</text>
      <text x="982" y="168">Release</text><text x="982" y="188">a new version</text>
    </g>
    <g font-size="12">
      <text x="58" y="216">Review real Claude</text><text x="58" y="232">sessions and repeated</text><text x="58" y="248">corrections.</text>
      <text x="288" y="216">Log the narrative,</text><text x="288" y="232">the moment, and the</text><text x="288" y="248">exact problem.</text>
      <text x="518" y="216">Merge recurring needs.</text><text x="518" y="232">Leave one person’s</text><text x="518" y="248">taste behind.</text>
      <text x="982" y="216">Versioned skill,</text><text x="982" y="232">changelog for</text><text x="982" y="248">deployers.</text>
    </g>
  </g>
  <!-- layer chips -->
  <g stroke="#000" stroke-width="1.5">
    <rect x="748" y="208" width="164" height="32" rx="5" fill="#fff"/>
    <rect x="748" y="248" width="164" height="32" rx="5" fill="#fff"/>
    <rect x="748" y="288" width="164" height="32" rx="5" fill="url(#stripe)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="830" y="229" fill="#000">Skill guidance</text>
    <text x="830" y="269" fill="#000">Validation check</text>
    <rect x="764" y="293" width="132" height="22" rx="3" fill="#fff"/>
    <text x="830" y="309" fill="#000" font-weight="700">Product default</text>
  </g>

  <g stroke="#000" stroke-width="1.5" marker-end="url(#a)">
    <line x1="236" y1="185" x2="266" y2="185"/>
    <line x1="466" y1="185" x2="496" y2="185"/>
    <line x1="696" y1="185" x2="726" y2="185"/>
    <line x1="930" y1="185" x2="960" y2="185"/>
  </g>
  <!-- return loop -->
  <path d="M1062,260 V390 H138 V264" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="410" font-size="12" text-anchor="middle" fill="#000">observe again: did the pattern hold?</text>

  <line x1="40" y1="432" x2="1160" y2="432" stroke="#000" stroke-width="1"/>
  <text x="600" y="466" font-size="17" font-weight="700" text-anchor="middle" fill="#000">Prefer a better product default over more corrective instructions.</text>
</svg>
