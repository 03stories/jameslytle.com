<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Forward narrative chart-emphasis pattern</title>
  <desc id="desc">A concise headline highlights the leading category in aqua, matching an aqua striped bar so the intended data insight is immediately visible.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14264B"/><stop offset="0.5" stop-color="#25356B"/><stop offset="1" stop-color="#482E6A"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C142A"/><stop offset="1" stop-color="#16213E"/></linearGradient>
    <pattern id="heroStripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#43DFC5"/><rect x="7" width="7" height="14" fill="#199E97"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.34"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
  <text x="90" y="104" fill="#F7FAFF" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="750">Encode the insight, not just the chart</text>
  <text x="90" y="151" fill="#AEBBD4" font-family="Inter, Arial, sans-serif" font-size="23">Synthetic example of a reusable narrative-design convention</text>

  <g filter="url(#shadow)">
    <rect x="180" y="210" width="690" height="690" rx="42" fill="url(#page)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="525" cy="250" r="5" fill="#FFFFFF" fill-opacity="0.45"/>
    <text x="240" y="326" fill="#F8FAFF" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="500">The strongest result came from</text>
    <text x="240" y="386" fill="#43DFC5" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">guided onboarding</text>
    <text x="240" y="430" fill="#C7D0E6" font-family="Inter, Arial, sans-serif" font-size="21">Completion rate by experience type</text>

    <line x1="270" y1="764" x2="800" y2="764" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <rect x="300" y="608" width="90" height="156" rx="10" fill="#FFFFFF" fill-opacity="0.72"/>
      <text x="345" y="590" fill="#E8ECF7" font-size="19" font-weight="650">48%</text>
      <text x="345" y="804" fill="#C7D0E6" font-size="18">Self-serve</text>

      <rect x="454" y="488" width="90" height="276" rx="10" fill="url(#heroStripe)" stroke="#7EF5E1" stroke-width="3"/>
      <text x="499" y="468" fill="#43DFC5" font-size="23" font-weight="800">72%</text>
      <text x="499" y="804" fill="#43DFC5" font-size="18" font-weight="700">Guided</text>

      <rect x="608" y="562" width="90" height="202" rx="10" fill="#FFFFFF" fill-opacity="0.72"/>
      <text x="653" y="544" fill="#E8ECF7" font-size="19" font-weight="650">59%</text>
      <text x="653" y="804" fill="#C7D0E6" font-size="18">Hybrid</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="980" y="282" fill="#43DFC5" font-size="18" font-weight="800" letter-spacing="2">ONE CONNECTED EMPHASIS SYSTEM</text>
    <circle cx="1003" cy="360" r="18" fill="#43DFC5"/><text x="1003" y="367" fill="#102638" text-anchor="middle" font-size="17" font-weight="800">1</text>
    <text x="1042" y="365" fill="#F7FAFF" font-size="27" font-weight="700">Name the finding</text>
    <text x="1042" y="400" fill="#AEBBD4" font-size="20">A short headline says what matters.</text>

    <circle cx="1003" cy="500" r="18" fill="#43DFC5"/><text x="1003" y="507" fill="#102638" text-anchor="middle" font-size="17" font-weight="800">2</text>
    <text x="1042" y="505" fill="#F7FAFF" font-size="27" font-weight="700">Connect through color</text>
    <text x="1042" y="540" fill="#AEBBD4" font-size="20">Headline and referenced bar share a cue.</text>

    <circle cx="1003" cy="640" r="18" fill="#43DFC5"/><text x="1003" y="647" fill="#102638" text-anchor="middle" font-size="17" font-weight="800">3</text>
    <text x="1042" y="645" fill="#F7FAFF" font-size="27" font-weight="700">Make the bar unmistakable</text>
    <text x="1042" y="680" fill="#AEBBD4" font-size="20">A restrained stripe creates a focal point.</text>

    <rect x="965" y="754" width="490" height="106" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="1004" y="800" fill="#F7FAFF" font-size="21" font-weight="650">The system guides attention without</text>
    <text x="1004" y="832" fill="#F7FAFF" font-size="21" font-weight="650">requiring manual cleanup on every page.</text>
  </g>
</svg>
