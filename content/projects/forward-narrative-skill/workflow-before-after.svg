<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">From deployment bottleneck to team capability</title>
  <desc id="d">Before: one specialist created each narrative locally, opened a pull request, waited for review and merge, deployed, and then shared a URL, a multi-day path. After: any teammate brings sales context to Claude with the Forward skill, the Dispatch MCP validates, saves, and shares, and a shareable narrative comes back.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>

  <!-- BEFORE -->
  <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">BEFORE · ONE SPECIALIST</text>
  <text x="40" y="64" font-size="12" fill="#000">every narrative went through code review and deployment</text>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#000" stroke-width="1"/>
  <g stroke="#000" fill="#fff" stroke-width="1.5">
    <rect x="40" y="104" width="190" height="72" rx="8"/>
    <rect x="270" y="104" width="190" height="72" rx="8"/>
    <rect x="500" y="104" width="190" height="72" rx="8"/>
    <rect x="730" y="104" width="190" height="72" rx="8"/>
    <rect x="960" y="104" width="200" height="72" rx="8" stroke-dasharray="6 4"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="135" y="137" font-size="16" font-weight="600">Create locally</text>
    <text x="135" y="158" font-size="12">hand-edited JSON</text>
    <text x="365" y="137" font-size="16" font-weight="600">Open a PR</text>
    <text x="365" y="158" font-size="12">wait for review</text>
    <text x="595" y="137" font-size="16" font-weight="600">Merge</text>
    <text x="595" y="158" font-size="12">coordinate the release</text>
    <text x="825" y="137" font-size="16" font-weight="600">Deploy</text>
    <text x="825" y="158" font-size="12">publish the build</text>
    <text x="1060" y="137" font-size="16" font-weight="600">Share a URL</text>
    <text x="1060" y="158" font-size="12">days later</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#a)">
    <line x1="230" y1="140" x2="266" y2="140"/>
    <line x1="460" y1="140" x2="496" y2="140"/>
    <line x1="690" y1="140" x2="726" y2="140"/>
    <line x1="920" y1="140" x2="956" y2="140"/>
  </g>

  <!-- AFTER -->
  <text x="40" y="254" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">AFTER · ANY TEAMMATE</text>
  <text x="40" y="274" font-size="12" fill="#000">no code changes, no deployment</text>
  <line x1="40" y1="288" x2="1160" y2="288" stroke="#000" stroke-width="1"/>
  <g stroke="#000" fill="#fff" stroke-width="1.5">
    <rect x="40" y="316" width="250" height="84" rx="8"/>
    <rect x="330" y="316" width="250" height="84" rx="8"/>
    <rect x="620" y="316" width="250" height="84" rx="8"/>
    <rect x="910" y="316" width="250" height="84" rx="8" stroke-width="3"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="165" y="352" font-size="16" font-weight="600">Sales context</text>
    <text x="165" y="374" font-size="12">audience · goal · story</text>
    <text x="455" y="352" font-size="16" font-weight="600">Claude + Forward skill</text>
    <text x="455" y="374" font-size="12">discover · draft · critique · refine</text>
    <text x="745" y="352" font-size="16" font-weight="600">Dispatch MCP</text>
    <text x="745" y="374" font-size="12">validate · save · share</text>
    <text x="1035" y="352" font-size="16" font-weight="700">Shareable narrative</text>
    <text x="1035" y="374" font-size="12">a link, in the same conversation</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#a)">
    <line x1="290" y1="358" x2="326" y2="358"/>
    <line x1="580" y1="358" x2="616" y2="358"/>
    <line x1="870" y1="358" x2="906" y2="358"/>
  </g>
  <!-- revise loop -->
  <path d="M1035,400 V430 H455 V404" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="745" y="448" font-size="12" text-anchor="middle" fill="#000">“change this one page” → only that page is patched</text>

  <!-- Caption -->
  <line x1="40" y1="486" x2="1160" y2="486" stroke="#000" stroke-width="1"/>
  <text x="600" y="518" font-size="18" font-weight="700" text-anchor="middle" fill="#000">Production became the fastest step.</text>
  <text x="600" y="542" font-size="15" text-anchor="middle" fill="#000">Human attention moved to the relationship and the story.</text>
</svg>
