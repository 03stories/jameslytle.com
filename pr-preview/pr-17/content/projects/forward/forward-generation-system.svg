<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">How Forward generates personalized narratives</title>
  <desc id="d">AI helps draft a template once at design time. People review every path and its conditions. At run time a deterministic engine applies the approved template to each customer's data, with no model calls, and a quality gate filters thin stories.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#fff"/>

  <!-- Column headers -->
  <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">
    <text x="60" y="36">1 · DESIGN TIME</text>
    <text x="440" y="36">2 · THE APPROVED TEMPLATE</text>
    <text x="860" y="36">3 · RUN TIME</text>
  </g>
  <g font-size="12" fill="#000">
    <text x="60" y="54">once per template</text>
    <text x="440" y="54">every narrative path, reviewed before generation</text>
    <text x="860" y="54">every recipient, automatically</text>
  </g>
  <line x1="40" y1="62" x2="1160" y2="62" stroke="#000" stroke-width="1"/>

  <!-- Column 1: design time -->
  <g stroke="#000" fill="#fff" stroke-width="1.5">
    <rect x="60" y="90" width="300" height="64" rx="8"/>
    <rect x="60" y="190" width="300" height="64" rx="8"/>
    <rect x="60" y="290" width="300" height="64" rx="8"/>
    <rect x="60" y="390" width="300" height="64" rx="8" stroke-width="3"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="210" y="119" font-size="16" font-weight="600">Brief + sample data</text>
    <text x="210" y="140" font-size="12">goals, audience, available fields</text>
    <text x="210" y="219" font-size="16" font-weight="600">AI drafts copy + conditions</text>
    <text x="210" y="240" font-size="12">fast exploration of options</text>
    <text x="210" y="319" font-size="16" font-weight="600">People review every path</text>
    <text x="210" y="340" font-size="12">exported: each variant + its condition</text>
    <text x="210" y="419" font-size="16" font-weight="700">Approved template</text>
    <text x="210" y="440" font-size="12">the only thing that reaches production</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#a)">
    <line x1="210" y1="154" x2="210" y2="186"/>
    <line x1="210" y1="254" x2="210" y2="286"/>
    <line x1="210" y1="354" x2="210" y2="386"/>
  </g>
  <!-- revise loop -->
  <path d="M60,322 H36 V222 H56" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="30" y="276" font-size="12" fill="#000" text-anchor="middle" transform="rotate(-90 30 276)">revise</text>

  <!-- Arrow col1 -> col2 -->
  <line x1="360" y1="422" x2="436" y2="422" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Column 2: template frame -->
  <rect x="440" y="80" width="340" height="440" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="490" y="100" width="240" height="40" rx="6" fill="#000"/>
  <text x="610" y="126" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Section: Your year in usage</text>

  <!-- condition 1 -->
  <line x1="610" y1="140" x2="610" y2="168" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
  <polygon points="610,172 700,202 610,232 520,202" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="610" y="207" font-size="13" font-weight="600" text-anchor="middle" fill="#000">usage grew?</text>
  <g stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M520,202 H495 V266"/>
    <path d="M700,202 H725 V266"/>
  </g>
  <text x="482" y="196" font-size="12" fill="#000">yes</text>
  <text x="712" y="196" font-size="12" fill="#000">no</text>
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <rect x="452" y="270" width="150" height="58" rx="6"/>
    <rect x="618" y="270" width="150" height="58" rx="6"/>
  </g>
  <g font-size="12" fill="#000" text-anchor="middle">
    <text x="527" y="294">“Your team grew</text>
    <text x="527" y="312">{growth}% this year”</text>
    <text x="693" y="294">“{users} people used</text>
    <text x="693" y="312">it every week”</text>
  </g>

  <!-- condition 2 -->
  <polygon points="610,350 700,380 610,410 520,380" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="610" y="385" font-size="13" font-weight="600" text-anchor="middle" fill="#000">enough data?</text>
  <g stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M520,380 H495 V440"/>
    <path d="M700,380 H725 V440"/>
  </g>
  <text x="482" y="374" font-size="12" fill="#000">yes</text>
  <text x="712" y="374" font-size="12" fill="#000">no</text>
  <rect x="452" y="444" width="150" height="44" rx="6" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="527" y="471" font-size="12" fill="#000" text-anchor="middle">screen included</text>
  <rect x="618" y="444" width="150" height="44" rx="6" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="693" y="471" font-size="12" fill="#000" text-anchor="middle">screen skipped</text>
  <text x="610" y="510" font-size="11" fill="#000" text-anchor="middle">{placeholders} fill from each customer's data row</text>

  <!-- Arrow col2 -> col3 -->
  <line x1="780" y1="232" x2="856" y2="232" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Column 3: run time -->
  <g stroke="#000" fill="#fff" stroke-width="1.5">
    <rect x="868" y="82" width="290" height="52" rx="6"/>
    <rect x="864" y="86" width="290" height="52" rx="6"/>
    <rect x="860" y="90" width="290" height="52" rx="6"/>
    <rect x="860" y="200" width="290" height="64" rx="8" stroke-width="3"/>
    <rect x="860" y="300" width="290" height="64" rx="8"/>
    <rect x="868" y="392" width="290" height="60" rx="6"/>
    <rect x="864" y="396" width="290" height="60" rx="6"/>
    <rect x="860" y="400" width="290" height="60" rx="6"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="1005" y="114" font-size="16" font-weight="600">Customer data rows</text>
    <text x="1005" y="132" font-size="12">~13,000</text>
    <text x="1005" y="229" font-size="16" font-weight="700">Deterministic engine</text>
    <text x="1005" y="250" font-size="12">no model calls · same input → same story</text>
    <text x="1005" y="329" font-size="16" font-weight="600">Quality gate</text>
    <text x="1005" y="350" font-size="12">excludes or flags thin stories</text>
    <text x="1005" y="426" font-size="16" font-weight="600">Personalized narratives</text>
    <text x="1005" y="446" font-size="12">9,772 sent</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#a)">
    <line x1="1005" y1="142" x2="1005" y2="196"/>
    <line x1="1005" y1="264" x2="1005" y2="296"/>
    <line x1="1005" y1="364" x2="1005" y2="396"/>
  </g>

  <!-- Caption -->
  <line x1="40" y1="560" x2="1160" y2="560" stroke="#000" stroke-width="1"/>
  <text x="600" y="592" font-size="18" font-weight="700" text-anchor="middle" fill="#000">AI widens the options once.</text>
  <text x="600" y="616" font-size="15" text-anchor="middle" fill="#000">People approve one template. Code applies it to every customer.</text>
</svg>
