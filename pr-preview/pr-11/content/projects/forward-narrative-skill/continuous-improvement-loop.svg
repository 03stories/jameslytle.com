<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Continuous improvement loop for the Forward Narrative Skill</title>
  <desc id="desc">Team sessions create specific observations that are synthesized into durable patterns, assigned to the right system layer, released, and observed again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F4FF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7656E8"/><stop offset="1" stop-color="#279D91"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#25304A" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6E78A0"/></marker>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="#7656E8"/><rect x="5" width="5" height="10" fill="#A996F0"/></pattern>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="90" y="106" fill="#1A2340" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="750">A skill that improves through observed use</text>
  <text x="90" y="152" fill="#68718F" font-family="Inter, Arial, sans-serif" font-size="23">Specific evidence stays specific. Only recurring patterns become system changes.</text>

  <g fill="none" stroke="#6E78A0" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 380 320 C 470 235, 560 235, 650 320"/>
    <path d="M 920 320 C 1010 235, 1100 235, 1190 320"/>
    <path d="M 1320 450 C 1380 540, 1350 640, 1248 700"/>
    <path d="M 1050 780 C 950 860, 720 860, 620 780"/>
    <path d="M 350 700 C 250 630, 220 530, 280 450"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="100" y="260" width="310" height="190" rx="26" fill="#FFFFFF"/>
    <circle cx="150" cy="312" r="22" fill="#7656E8"/><text x="150" y="320" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">1</text>
    <text x="188" y="320" fill="#202946" font-size="27" font-weight="700">Observe team use</text>
    <text x="140" y="366" fill="#68718F" font-size="20">Review real Claude sessions</text>
    <text x="140" y="398" fill="#68718F" font-size="20">and repeated corrections.</text>

    <rect x="645" y="260" width="310" height="190" rx="26" fill="#FFFFFF"/>
    <circle cx="695" cy="312" r="22" fill="#7656E8"/><text x="695" y="320" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">2</text>
    <text x="733" y="320" fill="#202946" font-size="27" font-weight="700">Preserve evidence</text>
    <text x="685" y="366" fill="#68718F" font-size="20">Log the narrative, moment,</text>
    <text x="685" y="398" fill="#68718F" font-size="20">and exact design problem.</text>

    <rect x="1190" y="260" width="310" height="190" rx="26" fill="#FFFFFF"/>
    <circle cx="1240" cy="312" r="22" fill="#7656E8"/><text x="1240" y="320" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">3</text>
    <text x="1278" y="320" fill="#202946" font-size="27" font-weight="700">Synthesize patterns</text>
    <text x="1230" y="366" fill="#68718F" font-size="20">Merge recurring needs;</text>
    <text x="1230" y="398" fill="#68718F" font-size="20">leave one-off taste behind.</text>

    <rect x="1060" y="650" width="440" height="230" rx="26" fill="#FFFFFF"/>
    <circle cx="1110" cy="702" r="22" fill="#279D91"/><text x="1110" y="710" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">4</text>
    <text x="1148" y="710" fill="#202946" font-size="27" font-weight="700">Choose the right layer</text>
    <g font-size="18" font-weight="650">
      <rect x="1100" y="752" width="104" height="52" rx="14" fill="#ECE7FF"/><text x="1152" y="784" text-anchor="middle" fill="#5B43C0">Skill</text>
      <rect x="1218" y="752" width="118" height="52" rx="14" fill="#E4F4F2"/><text x="1277" y="784" text-anchor="middle" fill="#247D75">Validate</text>
      <rect x="1350" y="752" width="110" height="52" rx="14" fill="url(#stripe)"/><text x="1405" y="784" text-anchor="middle" fill="#FFFFFF">Default</text>
    </g>
    <text x="1100" y="842" fill="#68718F" font-size="18">Prefer a better product default when it</text>
    <text x="1100" y="868" fill="#68718F" font-size="18">can replace recurring corrective prose.</text>

    <rect x="100" y="650" width="520" height="230" rx="26" fill="url(#accent)"/>
    <circle cx="150" cy="702" r="22" fill="#FFFFFF" fill-opacity="0.22"/><text x="150" y="710" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">5</text>
    <text x="188" y="710" fill="#FFFFFF" font-size="27" font-weight="700">Release, use, observe again</text>
    <text x="140" y="762" fill="#F2EFFF" font-size="20">Version the skill, publish the change,</text>
    <text x="140" y="794" fill="#F2EFFF" font-size="20">and watch whether the pattern holds.</text>
    <text x="140" y="842" fill="#FFFFFF" font-size="18" font-weight="650">OPEN → IN PROGRESS → INCORPORATED</text>
  </g>
</svg>
