" stroke="#69716e"/><text x="500.0" y="434.0" font-size="18" text-anchor="middle" fill="#242928">Validation</text><path d="M 500 320 V 354 H 500 V 390" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 500 466 V 500 H 500 V 534" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="684" y="390" width="276" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="822.0" y="434.0" font-size="18" text-anchor="middle" fill="#242928">Product defaults</text><path d="M 500 320 V 354 H 822 V 390" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 822 466 V 500 H 500 V 534" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="362" y="534" width="276" height="76" rx="2" fill="#fff" stroke="#69716e"/><text x="500.0" y="569.0" font-size="18" text-anchor="middle" fill="#242928">Release</text><text x="500.0" y="593.0" font-size="13" text-anchor="middle" fill="#616965">version / publish / use</text><path d="M 362 572 H 20 V 138 H 40" fill="none" stroke="#69716e" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="40" y="643" font-size="14" text-anchor="start" fill="#616965">Feedback returns to observed team use.</text>
