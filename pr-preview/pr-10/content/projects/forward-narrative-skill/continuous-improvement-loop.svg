<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Continuous improvement loop for the Forward Narrative Skill</title>
<desc id="desc">Team sessions lead to specific evidence and recurring patterns. Choose skill guidance, validation, or product defaults, then release and observe team use again.</desc>
